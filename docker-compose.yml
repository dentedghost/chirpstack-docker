services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: chirpstack
      POSTGRES_USER: chirpstack
      POSTGRES_PASSWORD: chirpstack
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chirpstack -d chirpstack"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    command: ["mosquitto", "-c", "/mosquitto-no-auth.conf"]
    volumes:
      - mosquitto-conf:/mosquitto
    ports:
      - "11890:1883"

  chirpstack:
    image: ghcr.io/chirpstack/chirpstack:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mosquitto:
        condition: service_started
    command: ["--config", "/etc/chirpstack"]
    environment:
      CHIRPSTACK_POSTGRES_DSN: "postgres://chirpstack:chirpstack@postgres:5432/chirpstack?sslmode=disable"
      CHIRPSTACK_MQTT_BROKER: "mqtt://mosquitto:1883"
    volumes:
      - ./config:/etc/chirpstack:ro
    ports:
      - "18087:8080"

  chirpstack-rest-api:
    image: ghcr.io/chirpstack/chirpstack-rest-api:latest
    restart: unless-stopped
    depends_on:
      - chirpstack
    environment:
      SERVER: "chirpstack:8080"
      CORS: "*"
      INSECURE: "true"
    ports:
      - "18097:8090"

  gateway-bridge:
    image: ghcr.io/chirpstack/chirpstack-gateway-bridge:latest
    restart: unless-stopped
    depends_on:
      - mosquitto
    volumes:
      - ./config/gateway-bridge/chirpstack-gateway-bridge.toml:/etc/chirpstack-gateway-bridge/chirpstack-gateway-bridge.toml:ro
      - ./config/certs:/etc/chirpstack-gateway-bridge/certs:ro
    ports:
      - "13008:3001"

volumes:
  postgres-data:
  redis-data:
  mosquitto-conf:
