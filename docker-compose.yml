services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: chirpstack
      POSTGRES_USER: chirpstack
      POSTGRES_PASSWORD: chirpstack
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chirpstack -d chirpstack"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    command: ["mosquitto", "-c", "/mosquitto-no-auth.conf"]
    volumes:
      - mosquitto-conf:/mosquitto
    ports:
      - "11890:1883"

  chirpstack:
    image: ghcr.io/chirpstack/chirpstack:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mosquitto:
        condition: service_started
    command: ["--config", "/etc/chirpstack"]
    environment:
      CHIRPSTACK_POSTGRES_DSN: "postgres://chirpstack:chirpstack@postgres:5432/chirpstack?sslmode=disable"
      CHIRPSTACK_MQTT_BROKER: "mqtt://mosquitto:1883"
    volumes:
      - ./config:/etc/chirpstack:ro
    ports:
      - "18087:8080"

  chirpstack-rest-api:
    image: ghcr.io/chirpstack/chirpstack-rest-api:latest
    restart: unless-stopped
    depends_on:
      - chirpstack
    environment:
      SERVER: "chirpstack:8080"
      CORS: "*"
      INSECURE: "true"
    ports:
      - "18097:8090"

  gateway-bridge:
    image: ghcr.io/chirpstack/chirpstack-gateway-bridge:latest
    restart: unless-stopped
    depends_on:
      - mosquitto
    environment:
      INTEGRATION__MQTT__EVENT_TOPIC_TEMPLATE: "us915_0/gateway/{{ .GatewayID }}/event/{{ .EventType }}"
      INTEGRATION__MQTT__STATE_TOPIC_TEMPLATE: "us915_0/gateway/{{ .GatewayID }}/state/{{ .StateType }}"
      INTEGRATION__MQTT__COMMAND_TOPIC_TEMPLATE: "us915_0/gateway/{{ .GatewayID }}/command/#"
      INTEGRATION__MQTT__AUTH__TYPE: "generic"
      INTEGRATION__MQTT__AUTH__GENERIC__SERVERS: "tcp://mosquitto:1883"
      INTEGRATION__MQTT__AUTH__GENERIC__USERNAME: ""
      INTEGRATION__MQTT__AUTH__GENERIC__PASSWORD: ""
    ports:
      - "1700:1700/udp"

volumes:
  postgres-data:
  redis-data:
  mosquitto-conf:

